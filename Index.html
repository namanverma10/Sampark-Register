<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sampark Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg: #F1F0E6;
    --paper: #FFFFFF;
    --ink: #1B2E2A;
    --ink-soft: #56645F;
    --line: #E2DFD1;
    --teal: #2F6F62;
    --teal-dark: #1F4E44;
    --teal-tint: #E7F0EC;
    --marigold: #C9820A;
    --marigold-tint: #FBF0D9;
    --marigold-line: #E9C579;
    --rust: #B5533C;
    --rust-tint: #F7E7E2;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 10% -10%, rgba(47,111,98,0.07), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 18px 80px;}

  /* Header */
  .masthead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .masthead .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--teal-dark);
    font-weight:700;
    margin-bottom:4px;
  }
  .masthead h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    line-height:1.05;
    margin:0;
    letter-spacing:-0.01em;
  }
  .masthead .sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:6px;
    max-width:460px;
  }

  .header-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .upload-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--teal);
    color:#fff;
    border:none;
    padding:11px 18px;
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 0 var(--teal-dark);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .upload-btn.secondary{
    background:var(--paper);
    color:var(--teal-dark);
    border:1px solid var(--line);
    box-shadow:none;
  }
  .upload-btn:hover{transform:translateY(-1px);}
  .upload-btn:active{transform:translateY(1px); box-shadow:0 1px 0 var(--teal-dark);}
  .upload-btn svg{width:15px;height:15px;flex:none;}
  #fileInput{display:none;}

  /* Tabs */
  .tabbar{
    display:flex;
    gap:4px;
    margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .tabbar button{
    background:none;
    border:none;
    padding:10px 4px;
    margin-right:22px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2.5px solid transparent;
    position:relative;
    top:1px;
  }
  .tabbar button.active{color:var(--ink); border-bottom-color:var(--marigold);}
  .tabbar button .pill{
    display:inline-block;margin-left:6px;
    background:var(--teal-tint); color:var(--teal-dark);
    font-size:10.5px; font-weight:700;
    padding:1px 7px; border-radius:999px;
  }
  .tabbar button.active .pill{background:var(--marigold-tint); color:var(--marigold);}

  /* Stats strip - "register stamp" */
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .stat-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
    position:relative;
    overflow:hidden;
  }
  .stat-card .num{
    font-family:'Fraunces',serif;
    font-size:30px;
    font-weight:600;
    line-height:1;
  }
  .stat-card .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--ink-soft);
    font-weight:600;
    margin-top:6px;
  }
  .stat-card.total .num{color:var(--ink);}
  .stat-card.done{background:var(--marigold-tint); border-color:var(--marigold-line);}
  .stat-card.done .num{color:var(--marigold);}
  .stat-card.remain .num{color:var(--teal);}

  .progress-track{
    height:8px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--marigold),#E0A430);
    border-radius:999px;
    transition:width .35s ease;
  }

  /* Controls */
  .controls{
    display:flex;
    gap:10px;
    margin-bottom:16px;
    flex-wrap:wrap;
    align-items:center;
  }
  .search-box{
    flex:1;
    min-width:180px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:10px 14px 10px 36px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    outline:none;
  }
  .search-box input:focus{border-color:var(--teal);}
  .search-box svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;color:var(--ink-soft);
  }
  .seg{
    display:flex;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
  }
  .seg button{
    border:none;
    background:transparent;
    padding:7px 13px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .seg button.active{background:var(--teal); color:#fff;}

  .util-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:12px;
    color:var(--ink-soft);
    flex-wrap:wrap;
    gap:8px;
  }
  .util-row button.linklike{
    background:none;border:none;color:var(--rust);font-family:'Inter',sans-serif;
    font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;padding:0;
  }

  /* Empty state */
  .empty{
    text-align:center;
    padding:60px 20px;
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    background:var(--paper);
  }
  .empty .icon{
    width:46px;height:46px;margin:0 auto 14px;color:var(--teal);
  }
  .empty h3{
    font-family:'Fraunces',serif;
    font-size:19px;
    margin:0 0 6px;
  }
  .empty p{font-size:13.5px; color:var(--ink-soft); margin:0 0 18px;}

  /* Cards list */
  .list{display:flex; flex-direction:column; gap:8px;}
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px 14px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    transition:background .18s ease, border-color .18s ease;
    position:relative;
  }
  .card.done{
    background:var(--marigold-tint);
    border-color:var(--marigold-line);
  }
  .check{
    flex:none;
    width:24px;height:24px;
    border-radius:7px;
    border:2px solid var(--line);
    background:#fff;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    margin-top:2px;
    transition:all .15s ease;
  }
  .card.done .check{
    background:var(--marigold);
    border-color:var(--marigold);
  }
  .check svg{width:14px;height:14px;color:#fff; opacity:0; transform:scale(.6); transition:all .12s ease;}
  .card.done .check svg{opacity:1; transform:scale(1);}

  .card-body{flex:1; min-width:0;}
  .card-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }
  .card-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    color:var(--ink);
  }
  .card.done .card-name{color:var(--marigold);}
  .stamp{
    font-size:10px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--marigold);
    border:1px solid var(--marigold);
    padding:2px 7px;
    border-radius:999px;
    text-transform:uppercase;
    flex:none;
    transform:rotate(-3deg);
  }
  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:7px;
  }
  .tag{
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--teal-tint);
    padding:3px 9px;
    border-radius:999px;
    line-height:1.4;
  }
  .card.done .tag{background:rgba(255,255,255,.6);}
  .tag.mobile{
    color:var(--teal-dark);
    font-weight:600;
    background:transparent;
    border:1px solid var(--line);
  }
  .tag.time{
    color:var(--marigold);
    font-weight:600;
    background:transparent;
    border:1px solid var(--marigold-line);
  }
  .remove-btn{
    flex:none;
    width:24px;height:24px;
    border:none;background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    opacity:0;
    transition:opacity .15s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .card:hover .remove-btn{opacity:1;}
  .remove-btn:hover{color:var(--rust);}
  .remove-btn svg{width:15px;height:15px;}

  .toast{
    position:fixed;
    bottom:22px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:11px 18px;
    border-radius:999px;
    font-size:13px;
    font-weight:500;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.2);
    text-align:center;
    max-width:88vw;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .dupe-note{
    font-size:12px;
    color:var(--teal-dark);
    background:var(--teal-tint);
    border-radius:10px;
    padding:9px 13px;
    margin-bottom:14px;
    display:none;
  }

  /* Report view */
  .today-card{
    background:linear-gradient(135deg, var(--teal), var(--teal-dark));
    border-radius:16px;
    padding:20px 22px;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .today-card .big{
    font-family:'Fraunces',serif;
    font-size:38px;
    font-weight:700;
    line-height:1;
  }
  .today-card .label{font-size:12.5px; opacity:.85; margin-top:4px;}
  .today-card .date-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.1em;
    opacity:.75;
    font-weight:700;
    margin-bottom:6px;
  }
  .export-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    padding:9px 15px;
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .export-btn:hover{background:rgba(255,255,255,.26);}
  .export-btn svg{width:14px;height:14px;}

  .date-group{margin-bottom:22px;}
  .date-heading{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .date-heading h4{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    margin:0;
    white-space:nowrap;
  }
  .date-heading .rule{flex:1; height:1px; background:var(--line);}
  .date-heading .count{
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--teal-tint);
    padding:2px 9px;
    border-radius:999px;
    white-space:nowrap;
  }

  .report-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--marigold);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:7px;
  }
  .report-row .time{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:14px;
    color:var(--marigold);
    width:66px;
    flex:none;
  }
  .report-row .rname{font-weight:600; font-size:14px; flex:1; min-width:0;}
  .report-row .rmeta{font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}

  @media (max-width:520px){
    .masthead h1{font-size:26px;}
    .stat-card .num{font-size:24px;}
    .stats{grid-template-columns:repeat(3,1fr); gap:7px;}
    .stat-card{padding:11px 10px;}
    .today-card .big{font-size:30px;}
    .report-row{flex-wrap:wrap;}
    .report-row .time{width:auto;}
  }
</style>
</head>

  function normName(s){
    return String(s||'').trim().toUpperCase().replace(/\s+/g,' ');
  }
  function normMobile(s){
    return String(s||'').replace(/\D/g,'');
  }

  function findKeyColumn(headers, patterns){
    for(const h of headers){
      const low = h.toLowerCase();
      if(patterns.some(p => low.includes(p))) return h;
    }
    return null;
  }

  function makeDedupeKey(row, headers){
    const nameCol = findKeyColumn(headers, ['name','naam']);
    const mobCol = findKeyColumn(headers, ['mob','phone','contact','number']);
    if(nameCol){
      const n = normName(row[nameCol]);
      const m = mobCol ? normMobile(row[mobCol]) : '';
      if(n) return 'N:'+n+(m ? '|'+m : '');
    }
    return 'R:'+headers.map(h=>String(row[h]||'').trim().toLowerCase()).join('|');
  }

  /* ---------- Excel parsing ---------- */

  function findHeaderRowIndex(aoa){
    for(let i=0;i<Math.min(aoa.length,12);i++){
      const row = aoa[i] || [];
      const nonEmpty = row.filter(c => c!==null && c!==undefined && String(c).trim()!=='');
      if(nonEmpty.length >= 3){
        const numericCount = nonEmpty.filter(c => typeof c === 'number').length;
        if(numericCount / nonEmpty.length < 0.5) return i;
      }
    }
    return 0;
  }

  function parseWorkbookToRows(wb){
    let allRows = [];
    wb.SheetNames.forEach(sheetName => {
      const ws = wb.Sheets[sheetName];
      const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      if(!aoa.length) return;
      const headerIdx = findHeaderRowIndex(aoa);
      const rawHeaders = (aoa[headerIdx]||[]).map(h => String(h||'').trim());
      const headers = rawHeaders.map((h,i) => h || ('Col'+(i+1)));
      for(let r = headerIdx+1; r<aoa.length; r++){
        const rowArr = aoa[r] || [];
        const nonEmpty = rowArr.filter(c => c!==null && c!==undefined && String(c).trim()!=='');
        if(nonEmpty.length === 0) continue;
        const obj = {};
        headers.forEach((h,ci) => {
          if(!h) return;
          let val = rowArr[ci];
          if(val===undefined || val===null) val='';
          obj[h] = String(val).trim();
        });
        allRows.push({headers, row: obj});
      }
    });
    return allRows;
  }

  /* ---------- PDF parsing ---------- */

  const MOBILE_RE = /(?:\+?91[\s-]?)?[6-9]\d{9}(?:\s*,\s*(?:\+?91[\s-]?)?[6-9]\d{9})*/;
  const SKIP_LINE_RE = /^(sr\.?\s*no\.?|page\s+\d+\s+of\s+\d+|note\s*:|dayitva|vistar|sampark)$/i;

  async function parsePdfToRows(file){
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    const lines = [];

    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const content = await page.getTextContent();
      const items = content.items.map(it => ({
        text: it.str,
        x: it.transform[4],
        y: Math.round(it.transform[5])
      })).filter(it => it.text && it.text.trim()!=='');

      // cluster into lines by y (allow small tolerance)
      items.sort((a,b) => b.y - a.y || a.x - b.x);
      let clusters = [];
      items.forEach(it => {
        let cluster = clusters.find(c => Math.abs(c.y - it.y) <= 3);
        if(!cluster){ cluster = {y: it.y, items: []}; clusters.push(cluster); }
        cluster.items.push(it);
      });
      clusters.forEach(c => {
        c.items.sort((a,b) => a.x - b.x);
        const text = c.items.map(i=>i.text).join(' ').replace(/\s+/g,' ').trim();
        if(text) lines.push(text);
      });
    }

    const headers = ['Name','Mobile','Details'];
    const rows = [];
    lines.forEach(line => {
      const clean = line.trim();
      if(!clean || clean.length < 2) return;
      if(SKIP_LINE_RE.test(clean)) return;
      if(/^done$/i.test(clean)) return;

      const mobMatch = clean.match(MOBILE_RE);
      let name = clean;
      let mobile = '';
      let details = '';

      if(mobMatch){
        mobile = mobMatch[0].replace(/\s+/g,'');
        name = clean.slice(0, mobMatch.index).trim();
        details = clean.slice(mobMatch.index + mobMatch[0].length).trim();
      }
      // strip a leading serial number like "12" or "12."
      name = name.replace(/^\d{1,4}[\.\)]?\s+/, '').trim();
      // strip leading/trailing separators
      name = name.replace(/^[-–|:\s]+|[-–|:\s]+$/g,'').trim();

      if(!name && !mobile) return;
      if(!name) name = mobile;

      rows.push({headers, row: {Name: name, Mobile: mobile, Details: details}});
    });

    return rows;
  }

  /* ---------- Merge ---------- */

  function mergeIntoRecords(parsedRows){
    let added = 0, dupes = 0;
    const existingKeys = new Set(records.map(r=>r.__key));
    parsedRows.forEach(({headers, row}) => {
      const key = makeDedupeKey(row, headers);
      if(existingKeys.has(key)){ dupes++; return; }
      existingKeys.add(key);
      records.push({
        __id: 'r'+Date.now()+Math.random().toString(36).slice(2,8),
        __key: key,
        __done: false,
        __doneAt: null,
        __cols: row
      });
      added++;
    });
    return {added, dupes};
  }

  async function handleFile(e){
    const file = e.target.files[0];
    if(!file) return;
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    try{
      let parsedRows;
      if(isPdf){
        showToast('PDF padha ja raha hai...');
        parsedRows = await parsePdfToRows(file);
      } else {
        const data = await file.arrayBuffer();
        const wb = XLSX.read(data, {type:'array'});
        parsedRows = parseWorkbookToRows(wb);
      }
      if(!parsedRows.length){
        showToast('Is file mein koi record nahi mila.');
        return;
      }
      const {added, dupes} = mergeIntoRecords(parsedRows);
      await saveRecords();
      currentTab = 'records';
      render();
      dupeNote.style.display = 'block';
      dupeNote.textContent = `"${file.name}" se ${added} naye record jode gaye.` + (dupes>0 ? ` ${dupes} duplicate skip kiye gaye.` : '');
      showToast(`${added} record add · ${dupes} duplicate hataye`);
    }catch(err){
      console.error(err);
      showToast('File padhne mein error aayi. Sahi Excel ya PDF file try karo.');
    }
    fileInput.value = '';
  }

  /* ---------- Storage ---------- */

  /* ---------- Persistent Storage ----------
     Primary: ChatGPT/web storage when available.
     Fallback: browser localStorage, so checked records survive
     closing/reopening the HTML page in the same browser.
  -------------------------------------------------------------- */
  async function saveRecords(){
    const data = JSON.stringify(records);
    let saved = false;

    // Try the existing web storage first.
    try{
      if(window.storage && typeof window.storage.set === 'function'){
        await window.storage.set(STORAGE_KEY, data, false);
        saved = true;
      }
    }catch(err){
      console.warn('web storage unavailable, using browser localStorage', err);
    }

    // Always keep a browser-local copy as a fallback.
    try{
      localStorage.setItem(STORAGE_KEY, data);
      saved = true;
    }catch(err){
      console.error('localStorage save failed', err);
    }

    if(!saved){
      showToast('Data save nahi ho paaya. Browser storage allow karein.');
    }
  }

  async function loadRecords(){
    // Try the existing web storage first.
    try{
      if(window.storage && typeof window.storage.get === 'function'){
        const res = await window.storage.get(STORAGE_KEY, false);
        if(res && res.value){
          records = JSON.parse(res.value);
          records.forEach(r => { if(r.__doneAt === undefined) r.__doneAt = null; });
          // Keep localStorage in sync too.
          try{ localStorage.setItem(STORAGE_KEY, res.value); }catch(e){}
          return true;
        }
      }
    }catch(err){
      console.warn('web storage load unavailable, trying localStorage', err);
    }

    // Browser-local persistent storage.
    try{
      const data = localStorage.getItem(STORAGE_KEY);
      if(data){
        records = JSON.parse(data);
        records.forEach(r => { if(r.__doneAt === undefined) r.__doneAt = null; });
        return true;
      }
    }catch(err){
      console.error('localStorage load failed', err);
    }

    return false;
  }

  // Extra safety: save the latest state when the page is being closed/refreshed.

  function pickDisplayColumns(rec){
    const cols = rec.__cols;
    const headers = Object.keys(cols);
    const nameCol = findKeyColumn(headers, ['name','naam']);
    const mobCol = findKeyColumn(headers, ['mob','phone','contact','number']);
    const others = headers.filter(h => h!==nameCol && h!==mobCol && cols[h]);
    return {nameCol, mobCol, others};
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fmtDateKey(iso){
    const d = new Date(iso);
    return d.toISOString().slice(0,10); // YYYY-MM-DD, local-ish enough
  }
  function fmtDateLabel(dateKey){
    const d = new Date(dateKey+'T00:00:00');
    return d.toLocaleDateString('hi-IN', {day:'numeric', month:'long', year:'numeric'});
  }
  function fmtTime(iso){
    const d = new Date(iso);
    return d.toLocaleTimeString('hi-IN', {hour:'2-digit', minute:'2-digit'});
  }
  function todayKey(){
    return new Date().toISOString().slice(0,10);
  }

  /* ---------- Report view ---------- */

  function groupedDoneRecords(){
    const done = records.filter(r => r.__done && r.__doneAt);
    const groups = {};
    done.forEach(r => {
      const key = fmtDateKey(r.__doneAt);
      if(!groups[key]) groups[key] = [];
      groups[key].push(r);
    });
    const dateKeys = Object.keys(groups).sort((a,b)=> b.localeCompare(a));
    dateKeys.forEach(k => groups[k].sort((a,b)=> new Date(a.__doneAt) - new Date(b.__doneAt)));
    return {groups, dateKeys};
  }

        </div>
        <button class="export-btn" id="exportPdfBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          Sampark Report PDF Nikaalo
        </button>
      </div>
    `;

    if(dateKeys.length === 0){
      html += `
        <div class="empty">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>
          <h3>Abhi tak koi sampark record nahi</h3>
          <p>Records tab mein jaakar naam ke aage checkbox tick karo — yahan uska date-time ka record ban jayega.</p>
        </div>
      `;
      pageContent.innerHTML = html;
      return;
    }

    dateKeys.forEach(key => {
      const items = groups[key];
      html += `
        <div class="date-group">
          <div class="date-heading">
            <h4>${key===tKey ? 'Aaj — ' : ''}${fmtDateLabel(key)}</h4>
            <div class="rule"></div>
            <div class="count">${items.length} sampark</div>
          </div>
          ${items.map(r => {
            const {nameCol, mobCol} = pickDisplayColumns(r);
            const name = nameCol ? r.__cols[nameCol] : (Object.values(r.__cols)[0] || '');
            const mobile = mobCol ? r.__cols[mobCol] : '';
            return `
              <div class="report-row">
                <div class="time">${fmtTime(r.__doneAt)}</div>
                <div class="rname">${escapeHtml(name)}</div>
                <div class="rmeta">${escapeHtml(mobile)}</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    });

    pageContent.innerHTML = html;
    document.getElementById('exportPdfBtn').addEventListener('click', exportReportPdf);
  }

  function exportReportPdf(){
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:'pt', format:'a4'});
      const {groups, dateKeys} = groupedDoneRecords();
      const pageWidth = doc.internal.pageSize.getWidth();
      const margin = 40;

      doc.setFont('helvetica','bold');
      doc.setFontSize(16);
      doc.setTextColor(31,78,68);
      doc.text('Sampark Report - Karyakarta Tracker', margin, 46);
      doc.setFontSize(9.5);
      doc.setFont('helvetica','normal');
      doc.setTextColor(90,100,95);
      const totalDone = records.filter(r=>r.__done).length;
      doc.text(`Total sampark: ${totalDone}  |  Banaya gaya: ${new Date().toLocaleString('hi-IN')}`, margin, 62);

      let cursorY = 82;

      if(dateKeys.length === 0){
        doc.setTextColor(20,20,20);
        doc.setFontSize(11);
        doc.text('Abhi tak koi sampark record nahi hai.', margin, cursorY);
      }

      dateKeys.forEach((key, idx) => {
        const items = groups[key];
        if(cursorY > 750){ doc.addPage(); cursorY = 50; }

        doc.setFont('helvetica','bold');
        doc.setFontSize(11.5);
        doc.setTextColor(31,78,68);
        doc.text(`${fmtDateLabel(key)}  (${items.length} sampark)`, margin, cursorY);
        cursorY += 8;

        const body = items.map((r,i) => {
          const {nameCol, mobCol} = pickDisplayColumns(r);
          const name = nameCol ? r.__cols[nameCol] : (Object.values(r.__cols)[0] || '');
          const mobile = mobCol ? r.__cols[mobCol] : '';
          return [String(i+1), fmtTime(r.__doneAt), name || '', mobile || ''];
        });

        doc.autoTable({
          startY: cursorY + 4,
          head: [['Sr.', 'Samay (Time)', 'Naam', 'Mobile No.']],
          body: body,
          margin: {left: margin, right: margin},
          styles: {font:'helvetica', fontSize:9.5, cellPadding:5, textColor:[27,46,42]},
          headStyles: {fillColor:[47,111,98], textColor:255, fontStyle:'bold'},
          alternateRowStyles: {fillColor:[247,246,239]},
          columnStyles: {0:{cellWidth:30}, 1:{cellWidth:80}},
        });
        cursorY = doc.lastAutoTable.finalY + 22;
      });

      const dateStamp = new Date().toISOString().slice(0,10);
      doc.save(`Sampark_Report_${dateStamp}.pdf`);
      showToast('Sampark report PDF download ho gayi');
    }catch(err){
      console.error(err);
      showToast('PDF banane mein error aayi.');
    }
  }

  /* ---------- Root render ---------- */

  function render(){
    renderTabbar();
    if(currentTab === 'report') renderReportView();
    else renderRecordsView();
  }

  async function init(){
    const loaded = await loadRecords();
    if(!loaded && SEED_DATA && SEED_DATA.length){
      const seedRows = SEED_DATA.map(row => ({headers: Object.keys(row), row}));
      mergeIntoRecords(seedRows);
      await saveRecords();
    }
    render();
  }

  init();
})();
</script>
</body>
</html>
